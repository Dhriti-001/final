<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Vector | User Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Branding Header -->
            <div class="auth-logo-center">
                <div class="auth-shield-wrap">
                    <svg viewBox="0 0 28 32" class="auth-shield-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2L3 6.8V15.5C3 22.2 7.8 28.3 14 30C20.2 28.3 25 22.2 25 15.5V6.8L14 2Z" 
                              stroke="#2563EB" stroke-width="2.2" fill="rgba(37, 99, 235, 0.12)" stroke-linejoin="round"/>
                        <rect x="10" y="14" width="8" height="6.5" rx="1.5" stroke="#1D4ED8" stroke-width="1.8" fill="#FFFFFF"/>
                        <path d="M11.5 14V11.5C11.5 10.1 12.6 9 14 9C15.4 9 16.5 10.1 16.5 11.5V14" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round"/>
                        <circle cx="14" cy="17" r="1" fill="#2563EB"/>
                    </svg>
                </div>
                <h1 class="auth-brand-heading">THREAT VECTOR</h1>
                <p class="auth-brand-subheading">Cybersecurity Awareness and Training Platform</p>
            </div>

            <!-- Flash Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Quick Demo Login as Cadet -->
            <form action="{{ url_for('demo_login') }}" method="POST" class="demo-login-form">
                <button type="submit" class="btn-demo-login">
                    <span class="demo-bolt-icon">⚡</span> Quick Demo Login as Cadet
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider-block">
                <div class="auth-divider-line"></div>
                <span class="auth-divider-label">Or Standard Sign In</span>
                <div class="auth-divider-line"></div>
            </div>

            <!-- Auth Tabs (Sign In / Create Account) -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchTab('login')">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register-btn" onclick="switchTab('register')">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <form id="form-login" action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-auth-action">
                    Sign In &rarr;
                </button>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="form-register" action="{{ url_for('login') }}" method="POST" style="display: none;">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" class="form-control" placeholder="Choose a password (min 4 characters)" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-role">Role / Track</label>
                    <select id="reg-role" name="role" class="form-control">
                        <option value="Security Analyst">Security Analyst</option>
                        <option value="Incident Responder">Incident Responder</option>
                        <option value="Threat Intelligence Researcher">Threat Intelligence Researcher</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-purple btn-auth-action">
                    Create Account &rarr;
                </button>
            </form>

        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                loginBtn.classList.remove('active');
                regBtn.classList.add('active');
            }
        }
    </script>
</body>
</html>
